[project]
name = "document-analyzer"
version = "0.1.0"
description = "TaskMan document plan analyzer built on the DocuMind SDK"
requires-python = ">=3.11"
dependencies = [
  "documind==0.2.2",
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.4,<1.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The contract uses the same camelCase field names as the TypeScript PlanContent and the JSON
# schema; renaming them would break the shared contract.
"app/contracts.py" = ["N815"]
