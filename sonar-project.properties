# SonarQube / SonarCloud configuration for TaskMan.
# Local SonarQube: run the scanner from the repo root after `pnpm --filter server test:coverage`
# and `pnpm --filter client test:coverage` so coverage is included:
#   npx sonarqube-scanner -Dsonar.host.url=http://localhost:9000 -Dsonar.token=$SONAR_TOKEN
sonar.projectKey=taskman
sonar.projectName=TaskMan
sonar.sourceEncoding=UTF-8

sonar.sources=server/src,client/src
sonar.tests=server/src,client/src
sonar.test.inclusions=**/__tests__/**,**/__integration__/**,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,client/src/components/ui/**
sonar.coverage.exclusions=**/__tests__/**,**/__integration__/**,server/src/scripts/**,client/src/pages/design-system/**

sonar.javascript.lcov.reportPaths=server/coverage/lcov.info,client/coverage/lcov.info
