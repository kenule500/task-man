packages:
  - 'client'
  - 'services/api'
allowBuilds:
  esbuild: false
  '@swc/core': false
  '@parcel/watcher': false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - serialize-javascript@7.1.4
# Security: pin patched versions of transitive dependencies flagged by `pnpm audit`.
# braces and sprintf-js have no patched release; they are avoided instead: the unused
# shadcn CLI and nodemon were removed, and Jest's coverage config loader uses js-yaml 4
# (only `load` is called, which v4 supports), whose argparse no longer needs sprintf-js.
overrides:
  source-map-js: '>=1.2.2'
  '@modelcontextprotocol/sdk': '>=1.31.0'
  '@istanbuljs/load-nyc-config>js-yaml': ^4.1.0
  # Advisories reported by `pnpm audit` on 2026-10-24: patched releases only, no API changes.
  # follow-redirects >=1.16.2 for GHSA-mrwp-f3q8-3g9p (cross-realm sensitiveHeaders arrays are
  # discarded, so custom credentials could follow a redirect); 1.16.1 was vulnerable.
  follow-redirects: '>=1.16.2'
  ip-address: '>=10.7.4'
  body-parser: '>=2.4.0'
  fast-uri: '>=3.1.9'
  serialize-javascript: '>=7.1.4'
  zod: '>=4.6.7'
  # Advisories reported on 2026-11-03.
  # qs takes a patch-level bump (6.16.0 -> 6.16.1, still inside express' ^6 range).
  # minimatch and glob have no patched release inside the ranges their dependents declare
  # (ESLint wants minimatch ^10, test-exclude wants glob ^10), so they are forced one major up.
  # deepmerge is NOT here: CVE-2026-93753 has no patched release at all (npm wrongly advertises
  # 4.3.2; 4.3.1 is the newest). Like braces and sprintf-js above, it is avoided rather than pinned.
  qs: '>=6.16.1'
  minimatch: '>=11.0.1'
  glob: '>=14.0.2'
  # deepmerge is NOT avoided under @rollup/plugin-node-resolve: rollup's policy overrides can
  # remove a package it does not need, but this plugin calls require('deepmerge') directly, so
  # removing it there fails `vite build` while vite-plugin-pwa generates the service worker
  # ("Cannot find module 'deepmerge'"). It stays installed for the build and is reported below.
  'jest-config>deepmerge': '-'

# Hoist type packages to the root so the Vercel function compiler (which does not follow pnpm symlinks)
# can resolve transitive types: @types/express-serve-static-core, mongodb/bson behind mongoose, and the
# engine.io / socket.io-adapter types behind socket.io (ServerOptions extends engine.io's options)
publicHoistPattern:
  - "@types/*"
  - mongodb
  - bson
  - engine.io
  - socket.io-adapter
  - socket.io-parser
