version: 2
updates:
  # One weekly PR per package for npm dependencies (pnpm workspace), grouped to keep the noise low
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint does not support TypeScript 7 yet ("typescript-eslint does not support TS 7.0");
      # remove this once it does
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
